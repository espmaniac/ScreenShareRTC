<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShareScreenRTC</title>
  <link rel="icon" type="image/png" sizes="32x32" href="ico.png">
  <link rel="icon" type="image/svg+xml" href="ico.svg">
  <link rel="icon" type="image/x-icon" href="ico.ico">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; width: 100vw; min-height: 100vh; box-sizing: border-box; }
    body { min-height: 100vh; width: 100vw; background-color: #2b3137; display: flex; align-items: center; justify-content: center; }
    .center-block { background: #fff; border-radius: 22px; box-shadow: 0 8px 32px 0 rgba(31,38,135,0.18); padding: 2em; max-width: 780px; width: 92vw; min-width: 320px; margin: 2em auto; display: flex; flex-direction: column; align-items: center; }
    h2 { text-align: center; margin-bottom: 0.8em; color: #444; }
    button { margin: 0.2em 0.5em 0.2em 0; padding: 0.55em 1.2em; border-radius: 7px; border: none; background: #f3f3f3; color: #333; font-weight: 600; cursor: pointer; }
    button:hover, button:focus { background: rgba(255,145,136,0.15); color: #d82a72; }
    .hidden { display: none; }
    textarea, input[type="text"] { width: 100%; font-family: monospace; border-radius: 6px; border: 1.5px solid #eee; padding: 0.5em; margin: 0.2em 0 0.7em 0; box-sizing: border-box; background: #faf9fd; }
    .mode-buttons { width: 100%; display: flex; justify-content: center; gap: 0.8em; margin-bottom: 0.8em; }
    #qr-offer { margin: 1em 0; padding: 0.7em; background: #fff; border-radius: 12px; display: none; flex-direction: column; align-items: center; width: 100%; }
    #qr-offer.visible { display: flex; }
    #qrbox-offer { width: min(320px, 75vw); height: min(320px, 75vw); display: flex; align-items: center; justify-content: center; }
    #qrbox-offer img { width: 100%; height: 100%; object-fit: contain; }
    #qr-status { margin-top: 0.6em; color: #a33; font-size: 0.9em; }
    #video-local, #video-remote { width: 100%; max-width: 640px; margin: 1em auto 0.5em auto; background: #000; border-radius: 10px; display: none; }
    #video-local.active, #video-remote.active { display: block; }
    .full-width { width: 100%; }
    .label { font-weight: 700; margin-top: 0.4em; }
    .hint { font-size: 0.92em; color: #555; }
    body.viewer-simple #broadcast-url-block,
    body.viewer-simple #qr-offer,
    body.viewer-simple #broadcaster-controls,
    body.viewer-simple .mode-buttons,
    body.viewer-simple #url-mode-hint {
      display: none !important;
    }
    @media (max-width:600px) { .mode-buttons { flex-direction: column; } .center-block { padding: 1em; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body>
  <div class="center-block">
    <h2>ShareScreenRTC (Serverless)</h2>
    <div class="hint">No server. Computer generates QR/link, phone opens URL, and returns answer token.</div>
    <div class="hint" id="url-mode-hint"></div>

    <div class="mode-buttons">
      <button id="btn-cast">Start Broadcast</button>
      <button id="btn-view">Join Broadcast</button>
    </div>

    <div id="broadcast-url-block" class="full-width hidden">
      <div class="label">Broadcast URL:</div>
      <textarea id="broadcast-url-code" rows="3" readonly></textarea>
      <button id="copy-broadcast-url">Copy Broadcast URL</button>
    </div>

    <video id="video-local" muted playsinline controls></video>
    <video id="video-remote" playsinline controls autoplay></video>

    <div id="qr-offer">
      <b>1) Scan this QR on your phone</b>
      <div id="qrbox-offer"></div>
      <div id="qr-status" class="hidden"></div>
      <div class="hint">Phone opens viewer mode and creates answer token.</div>
    </div>

    <div class="full-width" id="broadcaster-controls">
      <div class="label">Compact response token (from phone):</div>
      <textarea id="response-token" rows="4" placeholder="Type/paste compact token"></textarea>
      <button id="apply-answer">Apply Response</button>

      <div class="label">Connection log:</div>
      <textarea id="datachannel-log" rows="8" readonly></textarea>
    </div>

    <div id="viewer-panel" class="full-width hidden">
      <div class="label">Answer token:</div>
      <textarea id="viewer-response-token" rows="4" readonly></textarea>
      <button id="copy-response-token">Copy answer token</button>
    </div>
  </div>

  <script>
    let pc;
    let dataChannel;
    let localStream = null;

    const btnCast = document.getElementById('btn-cast');
    const btnView = document.getElementById('btn-view');
    const videoLocal = document.getElementById('video-local');
    const videoRemote = document.getElementById('video-remote');
    const qrOffer = document.getElementById('qr-offer');
    const qrboxOffer = document.getElementById('qrbox-offer');
    const qrStatus = document.getElementById('qr-status');
    const responseTokenInput = document.getElementById('response-token');
    const applyAnswerBtn = document.getElementById('apply-answer');
    const broadcasterControls = document.getElementById('broadcaster-controls');
    const viewerPanel = document.getElementById('viewer-panel');
    const viewerResponseToken = document.getElementById('viewer-response-token');
    const copyResponseTokenBtn = document.getElementById('copy-response-token');
    const logArea = document.getElementById('datachannel-log');
    const urlModeHint = document.getElementById('url-mode-hint');
    const broadcastUrlBlock = document.getElementById('broadcast-url-block');
    const broadcastUrlCode = document.getElementById('broadcast-url-code');
    const copyBroadcastUrlBtn = document.getElementById('copy-broadcast-url');

    function log(msg) {
      logArea.value += `${new Date().toLocaleTimeString()} - ${msg}\n`;
      logArea.scrollTop = logArea.scrollHeight;
    }

    function generateQR(container, value) {
      container.innerHTML = '';
      qrStatus.classList.add('hidden');
      qrStatus.textContent = '';
      if (typeof qrcode !== 'function') {
        qrStatus.textContent = 'QR library did not load. Use the Broadcast URL text below.';
        qrStatus.classList.remove('hidden');
        return false;
      }
      try {
        const qr = qrcode(0, 'L');
        qr.addData(value);
        qr.make();
        container.innerHTML = qr.createImgTag(6, 0);
        return true;
      } catch (err) {
        qrStatus.textContent = `QR generation failed: ${err}`;
        qrStatus.classList.remove('hidden');
        return false;
      }
    }

    function b64urlEncode(bytes) {
      let binary = '';
      bytes.forEach((b) => { binary += String.fromCharCode(b); });
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    function b64urlDecode(str) {
      const base64 = str.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(str.length / 4) * 4, '=');
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function gzipBytes(text) {
      if (!window.CompressionStream) return null;
      const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
      const buffer = await new Response(stream).arrayBuffer();
      return new Uint8Array(buffer);
    }

    async function ungzipBytes(bytes) {
      if (!window.DecompressionStream) return null;
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const buffer = await new Response(stream).arrayBuffer();
      return new TextDecoder().decode(buffer);
    }

    async function encodeCompactPayload(payloadObj) {
      const json = JSON.stringify(payloadObj);
      const gz = await gzipBytes(json);
      if (gz && gz.length < json.length) return `G${b64urlEncode(gz)}`;
      return `P${b64urlEncode(new TextEncoder().encode(json))}`;
    }

    async function decodeCompactPayload(token) {
      if (!token || token.length < 2) throw new Error('Invalid token.');
      const mode = token[0];
      const bytes = b64urlDecode(token.slice(1));
      if (mode === 'G') {
        const json = await ungzipBytes(bytes);
        if (!json) throw new Error('Gzip decode unavailable in this browser.');
        return JSON.parse(json);
      }
      if (mode === 'P') return JSON.parse(new TextDecoder().decode(bytes));
      throw new Error('Unknown token format.');
    }

    function slimSdpForLan(sdp) {
      const lines = sdp.split('\n');
      const out = [];
      let sectionKey = 'session';
      const keptBySection = new Set();

      for (const rawLine of lines) {
        const line = rawLine.trimEnd();
        if (!line) continue;

        if (line.startsWith('m=')) {
          sectionKey = line;
          out.push(line);
          continue;
        }

        if (line.startsWith('a=candidate:')) {
          const normalized = ` ${line.toLowerCase()} `;
          const preferred = normalized.includes(' udp ') && normalized.includes(' typ host ');
          if (!keptBySection.has(sectionKey) && preferred) {
            out.push(line);
            keptBySection.add(sectionKey);
          } else if (!keptBySection.has(sectionKey) && !normalized.includes(' tcp ')) {
            out.push(line);
            keptBySection.add(sectionKey);
          }
          continue;
        }

        if (line.startsWith('a=end-of-candidates')) {
          if (keptBySection.has(sectionKey)) out.push(line);
          continue;
        }

        out.push(line);
      }

      return `${out.join('\r\n')}\r\n`;
    }

    function setPageStateFromUrl(url) {
      const mode = url.searchParams.get('mode');
      if (mode === 'view') {
        document.body.classList.add('viewer-simple');
        btnCast.classList.add('hidden');
        btnView.classList.add('hidden');
        broadcasterControls.classList.add('hidden');
        viewerPanel.classList.remove('hidden');
        urlModeHint.textContent = 'Viewer mode loaded from URL.';
      } else if (mode === 'cast') {
        document.body.classList.remove('viewer-simple');
        btnView.classList.add('hidden');
        btnCast.classList.remove('hidden');
        broadcasterControls.classList.remove('hidden');
        urlModeHint.textContent = 'Broadcaster mode loaded from URL.';
      } else {
        document.body.classList.remove('viewer-simple');
        viewerPanel.classList.add('hidden');
        urlModeHint.textContent = '';
      }
    }

    function getSharePageUrlBase() {
      const url = new URL(window.location.href);
      url.search = '';
      url.hash = '';
      return url.toString();
    }

    function buildViewUrl(offerEncoded = '') {
      const base = getSharePageUrlBase();
      if (offerEncoded) return `${base}?mode=view&offer=${encodeURIComponent(offerEncoded)}`;
      return `${base}?mode=view`;
    }

    function buildMobileViewerDataUrl(offerObj) {
      const offerEncoded = b64urlEncode(new TextEncoder().encode(JSON.stringify(offerObj)));
      const mobileHtml = `<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Viewer</title><style>body{margin:0;background:#111;color:#eee;font-family:system-ui;padding:10px}video{width:100%;max-height:56vh;background:#000;border-radius:8px}textarea{width:100%;box-sizing:border-box;font-family:monospace;margin-top:6px;background:#1a1a1a;color:#fff;border:1px solid #444;border-radius:6px;padding:8px}small{color:#bbb}</style><video id=v autoplay playsinline controls></video><div><small>Answer token</small><textarea id=t rows=6 readonly></textarea></div><script>(async()=>{const O=${JSON.stringify(offerEncoded)};const d=u=>decodeURIComponent(escape(atob(u.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(u.length/4)*4,'='))));const e=x=>btoa(unescape(encodeURIComponent(x))).replace(/\\+/g,'-').replace(/\\//g,'_').replace(/=+$/,'');const pc=new RTCPeerConnection({iceServers:[]});pc.ontrack=ev=>{if(ev.streams&&ev.streams[0])document.getElementById('v').srcObject=ev.streams[0]};await pc.setRemoteDescription(JSON.parse(d(O)));const a=await pc.createAnswer();await pc.setLocalDescription(a);await new Promise(r=>{if(pc.iceGatheringState==='complete')return r();pc.addEventListener('icegatheringstatechange',()=>pc.iceGatheringState==='complete'&&r());setTimeout(r,4000)});const s=pc.localDescription.sdp;const token='P'+e(JSON.stringify({a:s}));document.getElementById('t').value=token;})();<\\/script>`;
      return `data:text/html;base64,${btoa(unescape(encodeURIComponent(mobileHtml)))}`;
    }

    function createPeerConnection(isOfferer, stream = null) {
      pc = new RTCPeerConnection({ iceServers: [] });

      pc.onicecandidate = async (e) => {
        if (!e.candidate) {
          if (isOfferer) {
            const slimOfferSdp = slimSdpForLan(pc.localDescription.sdp);
            const offerObj = { type: pc.localDescription.type, sdp: slimOfferSdp };
            const offerEncoded = b64urlEncode(new TextEncoder().encode(JSON.stringify(offerObj)));

            let shareUrl = '';
            let shareMode = 'data';
            try {
              shareUrl = buildMobileViewerDataUrl(offerObj);
            } catch (err) {
              shareMode = 'web';
              shareUrl = buildViewUrl(offerEncoded);
              log(`data:text/html URL generation failed, fallback to page URL: ${err}`);
            }

            history.replaceState({}, '', `${location.pathname}?mode=cast`);
            const qrOk = generateQR(qrboxOffer, shareUrl);
            qrOffer.classList.add('visible');
            broadcastUrlCode.value = shareUrl;
            broadcastUrlBlock.classList.remove('hidden');
            console.log('[ShareScreenRTC] Phone link:', shareUrl);
            if (shareMode === 'data') {
              log(qrOk ? 'Broadcast and QR started. Scan QR on phone.' : 'Broadcast started. QR unavailable; use generated data:text/html URL below.');
            } else {
              log(qrOk ? 'Broadcast and QR started (fallback URL mode).' : 'Broadcast started. QR unavailable; use generated fallback URL below.');
            }
          } else {
            const slimAnswerSdp = slimSdpForLan(pc.localDescription.sdp);
            const payload = { a: slimAnswerSdp };
            const token = await encodeCompactPayload(payload);

            viewerPanel.classList.remove('hidden');
            viewerResponseToken.value = token;
            log('Viewer answer token is ready. Share token with broadcaster.');
          }
        }
      };

      if (isOfferer && stream) {
        stream.getTracks().forEach(track => pc.addTrack(track, stream));
        videoLocal.srcObject = stream;
        videoLocal.classList.add('active');
      } else {
        pc.ontrack = (event) => {
          if (event.streams && event.streams[0]) {
            videoRemote.srcObject = event.streams[0];
            videoRemote.classList.add('active');
            log('Remote video stream received.');
          }
        };
      }

      if (isOfferer) {
        dataChannel = pc.createDataChannel('data');
        setupDataChannel();
      } else {
        pc.ondatachannel = (event) => {
          dataChannel = event.channel;
          setupDataChannel();
        };
      }
    }

    function setupDataChannel() {
      dataChannel.onopen = () => log('DataChannel opened. WebRTC connected.');
      dataChannel.onmessage = (e) => log(`Received: ${e.data}`);
    }

    async function startBroadcast() {
      broadcastUrlCode.value = 'Preparing broadcast URL...';
      broadcastUrlBlock.classList.remove('hidden');
      qrOffer.classList.add('visible');
      qrboxOffer.innerHTML = '<div class="hint">Starting broadcast...</div>';

      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      } catch (e) {
        broadcastUrlCode.value = '';
        broadcastUrlBlock.classList.add('hidden');
        qrOffer.classList.remove('visible');
        alert(`Failed to capture screen: ${e}`);
        return;
      }

      qrStatus.classList.add('hidden');
      qrStatus.textContent = '';
      createPeerConnection(true, localStream);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      log('Broadcast started.');
    }

    async function joinBroadcast(offerEncoded) {
      const offerObj = JSON.parse(new TextDecoder().decode(b64urlDecode(offerEncoded)));
      createPeerConnection(false);
      videoRemote.classList.add('active');
      await pc.setRemoteDescription(offerObj);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      log('Joined as viewer. Creating answer...');
    }

    async function applyResponseFromInputs() {
      if (!pc || !pc.localDescription || pc.localDescription.type !== 'offer') {
        alert('Start broadcast first.');
        return;
      }

      const token = responseTokenInput.value.trim();
      if (!token) {
        alert('Paste/enter compact response token.');
        return;
      }

      let payload;
      try {
        payload = await decodeCompactPayload(token);
      } catch (e) {
        alert(`Cannot decode token: ${e}`);
        return;
      }

      if (!payload || !payload.a) {
        alert('Invalid response token.');
        return;
      }

      await pc.setRemoteDescription({ type: 'answer', sdp: payload.a });
      log('Answer applied. Connection should establish shortly.');
    }

    btnCast.onclick = () => startBroadcast();

    btnView.onclick = async () => {
      const url = new URL(location.href);
      const offer = url.searchParams.get('offer');
      if (!offer) {
        alert('Open this page from QR link that includes offer.');
        return;
      }
      await joinBroadcast(decodeURIComponent(offer));
    };

    applyAnswerBtn.onclick = () => applyResponseFromInputs();

    copyResponseTokenBtn.onclick = async () => {
      if (!viewerResponseToken.value) return;
      await navigator.clipboard.writeText(viewerResponseToken.value);
      log('Compact response token copied.');
    };

    copyBroadcastUrlBtn.onclick = async () => {
      if (!broadcastUrlCode.value) return;
      await navigator.clipboard.writeText(broadcastUrlCode.value);
      log('Broadcast URL copied.');
    };

    window.addEventListener('DOMContentLoaded', async () => {
      const url = new URL(location.href);
      setPageStateFromUrl(url);

      const mode = url.searchParams.get('mode');
      const offer = url.searchParams.get('offer');

      if (mode === 'view' && offer) {
        log('Offer found in URL. Auto-joining as viewer.');
        await joinBroadcast(decodeURIComponent(offer));
      }
    });
  </script>
</body>
</html>
